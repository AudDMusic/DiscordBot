name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -race ./...

    - name: Build
      run: go build -v -o discordBot .

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: discordBot
        path: discordBot
